<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Registered Users</title>

</head>

<body>


<h2>Event Management</h2>


<h3>

    Users Registered for:

    <span th:text="${event.name}"></span>

</h3>


<table border="1">

    <tr>

        <th>Username</th>

        <th>Email</th>

    </tr>


    <tr th:each="booking : ${bookings}">

        <td th:text="${booking.user.username}">
        </td>

        <td th:text="${booking.user.email}">
        </td>

    </tr>

</table>


<p th:if="${#lists.isEmpty(bookings)}">

    No users have booked this event yet.

</p>


<br>


<a href="/admin">

    Back to Admin Panel

</a>


<br>
<br>


<a href="/logout">

    Log Out

</a>


</body>

</html>
